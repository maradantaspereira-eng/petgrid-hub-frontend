<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetGrid Hub - Gestão de Produtos e Estoque</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <header>
            <img src="img/pet.png" alt="PetGrid Hub Logo">
            <h1>PETGRID HUB</h1>
            <p>Gestão Inteligente de Produtos e Estoque de Pet Shop</p>
        </header>

        <!-- KPI / Painel de Resumo -->
        <section class="kpi-section">
            <div class="kpi-card">
                <span class="kpi-title">Total de Produtos</span>
                <span class="kpi-value" id="kpiTotalProdutos">0</span>
            </div>
            <div class="kpi-card warning">
                <span class="kpi-title">Alertas de Estoque</span>
                <span class="kpi-value" id="kpiEstoqueCritico">0</span>
            </div>
            <div class="kpi-card success">
                <span class="kpi-title">Valor do Estoque</span>
                <span class="kpi-value" id="kpiValorEstoque">R$ 0,00</span>
            </div>
            <div class="kpi-card info">
                <span class="kpi-title">Categorias</span>
                <span class="kpi-value" id="kpiTotalCategorias">0</span>
            </div>
        </section>

        <section class="form-section">
            <h2 id="form-title">Adicionar Produto</h2>

            <form id="produtoForm">
                <input type="hidden" id="produtoId">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="nomeProduto">Produto *</label>
                        <input type="text" id="nomeProduto" required placeholder="Ex: Ração Premium Adultos 15kg">
                    </div>

                    <div class="form-group">
                        <label for="codigoBarras">Código de barras</label>
                        <input type="text" id="codigoBarras" placeholder="7891234567890">
                    </div>

                    <div class="form-group">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" placeholder="Ex: Golden, Pedigree, Premier">
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoria *</label>
                        <select id="categoria" required>
                            <option value="">Selecione</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tipoPet">Tipo de pet</label>
                        <select id="tipoPet">
                            <option value="">Selecione</option>
                            <option value="Cães">Cães</option>
                            <option value="Gatos">Gatos</option>
                            <option value="Aves">Aves</option>
                            <option value="Roedores">Roedores</option>
                            <option value="Peixes">Peixes</option>
                            <option value="Todos">Todos</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="unidadeVenda">Unidade de venda</label>
                        <select id="unidadeVenda">
                            <option value="UN">UN (Unidade)</option>
                            <option value="KG">KG (Quilo)</option>
                            <option value="L">L (Litro)</option>
                            <option value="PCT">PCT (Pacote)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="lote">Lote</label>
                        <input type="text" id="lote" placeholder="Ex: LOTE-2026-09">
                    </div>

                    <div class="form-group">
                        <label for="estoqueAtual">Estoque atual</label>
                        <input type="number" id="estoqueAtual" min="0" value="0">
                    </div>

                    <div class="form-group">
                        <label for="estoqueMinimo">Estoque mínimo</label>
                        <input type="number" id="estoqueMinimo" min="0" value="0">
                    </div>

                    <div class="form-group">
                        <label for="custoAquisicao">Custo de aquisição (R$)</label>
                        <input type="number" id="custoAquisicao" min="0" step="0.01" value="0.00">
                    </div>

                    <div class="form-group">
                        <label for="precoVenda">Preço de venda (R$)</label>
                        <input type="number" id="precoVenda" min="0" step="0.01" value="0.00">
                    </div>

                    <div class="form-group">
                        <label for="dataEntrada">Data de entrada</label>
                        <input type="date" id="dataEntrada">
                    </div>

                    <div class="form-group">
                        <label for="dataValidade">Data de validade</label>
                        <input type="date" id="dataValidade">
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btnSubmit">Adicionar produto</button>
                    <button type="button" class="btn btn-secondary" id="btnCancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Barra de Ferramentas / Busca e Visualização -->
        <section class="toolbar-section">
            <div class="search-bar">
                <input type="text" id="inputBusca" placeholder="🔍 Buscar por produto ou marca..." oninput="filtrarProdutos()">
                <select id="filtroCategoria" onchange="filtrarProdutos()">
                    <option value="">Todas as categorias</option>
                </select>
            </div>
            <div class="view-toggle">
                <button class="btn-toggle active" id="btnModoCards" onclick="alternarModo('cards')">🎴 Cards</button>
                <button class="btn-toggle" id="btnModoTabela" onclick="alternarModo('tabela')">📋 Tabela</button>
            </div>
        </section>

        <!-- Lista / Grid de Produtos -->
        <section class="products-section">
            <div id="cardsProdutos" class="cards-grid">
                <div class="empty-msg">Nenhum produto cadastrado.</div>
            </div>

            <div id="tabelaContainer" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Pet</th>
                            <th>Estoque</th>
                            <th>Preço</th>
                            <th>Validade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProdutos">
                        <tr>
                            <td colspan="8" class="empty-msg">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>


    </div>

    <script src="scripts.js"></script>
</body>
</html>
